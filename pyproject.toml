[project]
name = "cf-avg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "setuptools>=84.0.0",
    "torch>=2.6.0",
    "gymnasium[mujoco]>=1.3.0",
    "matplotlib>=3.11.2",
    "wandb>=0.30.0",
    "termcolor>=3.3.0",
    "opencv-python-headless>=5.0.0.93",
    "dm-control",
]

[tool.uv]
# keep the simulator every existing result was produced with
constraint-dependencies = ["mujoco==3.14.0"]
# labmaze (dm_control.locomotion mazes only) has no Python 3.13 wheel and needs bazel to build
exclude-dependencies = ["labmaze"]

[[tool.uv.index]]
# CPU-only PyTorch wheels (this project trains on CPU; the CUDA build is several GB larger)
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]
